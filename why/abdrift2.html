<!DOCTYPE html>
<html lang="de" data-bare>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liminal – Der letzte Gang</title>
    <meta name="robots" content="noindex">
    <link rel="stylesheet" href="../assets/css/liminal.css">
    <link rel="stylesheet" href="abdrift.css">
    <link rel="stylesheet" href="liminal-art.css">
    <script src="../assets/js/site.js"></script>
    <script src="../assets/js/core.js"></script>
    <script src="../assets/js/liminal.js"></script>
</head>
<body class="liminal lm-drift" data-lm-beine="3" data-lm-ton="riss schreie">
    <svg class="lm-drift__cracks" aria-hidden="true"></svg>
    <svg class="lm-drift__mark" aria-hidden="true"></svg>
    <main class="lm-room lm-drift__room" id="last-room">
        <p class="lm-small">Der Putz löst sich in dünnen Schichten.</p>
        <div class="lm-gap"></div>
        <p class="lm-big"><span class="lm-text" data-v="Der Nebel hat dich eingeholt.|Die Wand gibt nach.|Hinter dem Riss ist wieder derselbe Gang.">Der Nebel hat dich eingeholt.</span></p>
        <div class="lm-gap"></div>
        <p class="lm-big"><span class="lm-text" data-v="Du hörst vier Schritte.|Der fünfte Strich verschwindet.|Jetzt ist alles still.">Der fünfte Strich verschwindet.</span></p>
        <p class="lm-drift__status" id="return-status" aria-live="polite">Du wirst zurückgebracht.</p>
    </main>
    <script src="liminal-art.js"></script>
    <script>
        LM_ART.cracks(document.querySelector('.lm-drift__cracks'), { count: 7, pace: 1.9, delay: .2 });
        LM_ART.mark(document.querySelector('.lm-drift__mark'));
        XIRU.ready(function () {
            XIRU.riss.lock();
            document.getElementById('last-room').classList.add('is-failing');
            setTimeout(function () {
                location.replace('../index.html');
            }, 9000);
        });
    </script>
</body>
</html>

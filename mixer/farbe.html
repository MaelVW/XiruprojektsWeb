<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farbmixer · Xiruprojekts</title>
    <meta name="description" content="Farbmixer: Farben mischen, Harmonien finden und Paletten bauen – als HEX, RGB oder CSS-Variablen kopieren.">
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="css/mixer.css">
    <link rel="stylesheet" href="../assets/css/themes/mixer.css">
    <script src="../assets/js/site.js"></script>
    <script src="../assets/js/core.js"></script>
    <script src="js/mixer.js"></script>
    <style>
        .fm-pick { width: 3rem; height: 2.6rem; padding: 0; border: 1px solid var(--border-strong); border-radius: 8px; background: none; cursor: pointer; }
        #hex { width: 7.5rem; }
        .fm-pal { display: grid; grid-template-columns: repeat(5, 1fr); gap: .4rem; }
        .fm-sw { min-height: 5.5rem; border: 0; border-radius: 10px; cursor: pointer; display: flex; align-items: flex-end; justify-content: center; padding: .4rem; font: 600 .72rem var(--mono); color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.8); transition: transform .15s; }
        .fm-sw:hover { transform: translateY(-3px); }
        .fm-sw span { background: rgba(0,0,0,.35); padding: .1rem .35rem; border-radius: 4px; }
        .fm-sw--big { min-height: 3.2rem; min-width: 7rem; align-items: center; }
        .fm-sw--sm { min-height: 1.8rem; width: 2.2rem; padding: 0; }
        .fm-op { font-size: 1.4rem; font-weight: 800; color: var(--text-muted); }
        .fm-saved { display: flex; flex-direction: column; gap: .4rem; } .fm-row { display: flex; gap: .3rem; align-items: center; }
    </style>
</head>
<body class="theme-mixer">
<main class="content">
    <header class="page-head">
        <span class="eyebrow">🎛 Mixer-Studio</span>
        <h1>Farbmixer</h1>
        <p class="lead">Wähle eine Grundfarbe und lass dir passende Paletten zeigen – oder misch zwei Farben wie im Malkasten. Klick auf eine Farbe zum Kopieren.</p>
    </header>
    <div class="grid-2">
        <section class="card">
            <h3>Grundfarbe</h3>
            <div class="row"><input type="color" id="base" value="#22d3ee" class="fm-pick" aria-label="Grundfarbe"><input class="input mono" id="hex" value="#22d3ee" maxlength="7" aria-label="HEX-Wert"><button class="btn btn--sm" type="button" id="rnd">🎲 Zufall</button></div>
            <div class="field mt-1"><label for="mode">Harmonie</label>
                <select class="select" id="mode"><option value="analog">Analog (Nachbarn)</option><option value="komplement">Komplementär</option><option value="triade">Triade</option><option value="tetrade">Tetrade</option><option value="mono">Monochrom</option></select></div>
            <div class="fm-pal" id="pal"></div>
            <div class="row mt-1"><button class="btn btn--sm btn--primary" type="button" id="keep">★ Palette merken</button><button class="btn btn--sm" type="button" id="css">📋 Als CSS kopieren</button></div>
        </section>
        <section class="card">
            <h3>Farben mischen</h3>
            <div class="row"><input type="color" id="m1" value="#facc15" class="fm-pick" aria-label="Farbe 1"><span class="fm-op">+</span><input type="color" id="m2" value="#3b82f6" class="fm-pick" aria-label="Farbe 2"><span class="fm-op">=</span><button type="button" class="fm-sw fm-sw--big" id="mix"></button></div>
            <div class="field mt-1"><label for="ratio">Verhältnis <span id="ratio-v">50 : 50</span></label><input type="range" id="ratio" min="0" max="100" value="50"></div>
            <label class="small"><input type="checkbox" id="paint" checked> Wie Malfarbe mischen (Gelb + Blau = Grün)</label>
            <h3 class="mt-1">Gemerkte Paletten</h3>
            <div id="saved" class="fm-saved"><p class="small muted">Noch keine.</p></div>
        </section>
    </div>
</main>
<script>
XIRU.ready(function () {
    const X = XIRU;
    const M = X.Mixer, $ = s => X.$(s);
    const hex2rgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
    const rgb2hex = c => '#' + c.map(v => Math.round(X.clamp(v, 0, 255)).toString(16).padStart(2, '0')).join('');
    function rgb2hsl([r, g, b]) { r /= 255; g /= 255; b /= 255; const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2; let h = 0, s = 0;
        if (mx !== mn) { const d = mx - mn; s = l > .5 ? d / (2 - mx - mn) : d / (mx + mn); h = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; h *= 60; } return [h, s * 100, l * 100]; }
    function hsl2hex(h, s, l) { h = ((h % 360) + 360) % 360; s /= 100; l /= 100; const k = n => (n + h / 30) % 12, a = s * Math.min(l, 1 - l), f = n => l - a * Math.max(-1, Math.min(k(n) - 3, 9 - k(n), 1)); return rgb2hex([f(0), f(8), f(4)].map(v => v * 255)); }
    let pal = [];
    function palette() {
        const [h, s, l] = rgb2hsl(hex2rgb($('#base').value)), m = $('#mode').value;
        const H = { analog: [-40, -20, 0, 20, 40], komplement: [0, 0, 180, 180, 0], triade: [0, 120, 240, 0, 120], tetrade: [0, 90, 180, 270, 0], mono: [0, 0, 0, 0, 0] }[m];
        const Ls = m === 'mono' ? [15, 30, 45, 62, 80] : m === 'komplement' ? [l, X.clamp(l - 22, 8, 92), l, X.clamp(l + 18, 8, 92), X.clamp(l + 35, 8, 95)] : m === 'analog' ? [l, l, l, l, l] : [l, l, l, X.clamp(l - 20, 8, 92), X.clamp(l + 25, 8, 95)];
        pal = H.map((d, i) => hsl2hex(h + d, s, Ls[i]));
        $('#pal').innerHTML = pal.map(c => '<button type="button" class="fm-sw" style="background:' + c + '" data-c="' + c + '"><span>' + c + '</span></button>').join('');
    }
    function mix() {
        const a = hex2rgb($('#m1').value), b = hex2rgb($('#m2').value), t = $('#ratio').value / 100;
        let c;
        if ($('#paint').checked)   // subtraktiv (wie Pigmente): gewichtetes geometrisches Mittel, Gelb + Blau = Grün
            c = a.map((v, i) => 255 * Math.pow(Math.max(v, 8) / 255, 1 - t) * Math.pow(Math.max(b[i], 8) / 255, t) * 1.08);
        else c = a.map((v, i) => Math.sqrt(v * v * (1 - t) + b[i] * b[i] * t));
        const hx = rgb2hex(c); $('#mix').style.background = hx; $('#mix').dataset.c = hx; $('#mix').textContent = hx;
        $('#ratio-v').textContent = Math.round((1 - t) * 100) + ' : ' + Math.round(t * 100);
    }
    function saved() {
        const list = M.load('paletten', []);
        $('#saved').innerHTML = list.length ? list.map((p, i) => '<div class="fm-row">' + p.map(c => '<button type="button" class="fm-sw fm-sw--sm" style="background:' + c + '" data-c="' + c + '" title="' + c + '"></button>').join('') + '<button type="button" class="btn btn--sm btn--ghost" data-del="' + i + '">✕</button></div>').join('') : '<p class="small muted">Noch keine.</p>';
    }
    const ok = h => /^#[0-9a-f]{6}$/i.test(h);
    document.addEventListener('click', e => {
        const sw = e.target.closest('[data-c]'); if (sw && ok(sw.dataset.c)) M.copy(sw.dataset.c, sw.dataset.c);
        const del = e.target.closest('[data-del]'); if (del) { const l = M.load('paletten', []); l.splice(+del.dataset.del, 1); M.save('paletten', l); saved(); }
    });
    $('#base').addEventListener('input', () => { $('#hex').value = $('#base').value; palette(); });
    $('#hex').addEventListener('input', () => { const v = $('#hex').value.trim(); if (ok(v)) { $('#base').value = v.toLowerCase(); palette(); } });
    $('#rnd').addEventListener('click', () => { const v = hsl2hex(X.rand(0, 359), X.rand(55, 90), X.rand(45, 65)); $('#base').value = v; $('#hex').value = v; palette(); });
    $('#mode').addEventListener('change', palette);
    ['m1', 'm2', 'ratio', 'paint'].forEach(id => $('#' + id).addEventListener('input', mix));
    $('#keep').addEventListener('click', () => { const l = M.load('paletten', []); l.unshift(pal.slice()); M.save('paletten', l.slice(0, 12)); saved(); X.once('mx-palette', 5, 'Erste Palette'); });
    $('#css').addEventListener('click', () => M.copy(':root {\n' + pal.map((c, i) => '    --farbe-' + (i + 1) + ': ' + c + ';').join('\n') + '\n}', 'CSS-Variablen'));
    palette(); mix(); saved();
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="de" data-bare>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liminal – Der falsche Gang</title>
    <meta name="robots" content="noindex">
    <link rel="stylesheet" href="../assets/css/liminal.css">
    <link rel="stylesheet" href="abdrift.css">
    <link rel="stylesheet" href="liminal-art.css">
    <script src="../assets/js/site.js"></script>
    <script src="../assets/js/core.js"></script>
    <script src="../assets/js/liminal.js"></script>
</head>
<body class="liminal lm-drift" data-lm-beine="2" data-lm-ton="riss lueftung">
    <svg class="lm-drift__cracks" aria-hidden="true"></svg>
    <svg class="lm-drift__mark" aria-hidden="true"></svg>
    <main class="lm-room lm-drift__room">
        <p class="lm-small">Du hast den Takt verpasst.</p>
        <div class="lm-gap"></div>
        <p class="lm-big"><span class="lm-text" data-v="Der Zeiger ist weitergelaufen.|Der Generator antwortet nicht mehr.|Das war nicht der richtige Kontakt.">Der Zeiger ist weitergelaufen.</span></p>
        <div class="lm-gap"></div>
        <p class="lm-big"><span class="lm-text" data-v="An der Wand ist ein dunkler Handabdruck.|Ein Messer steckt schräg im Putz.|Die fünf Striche sind verwischt.">An der Wand ist ein dunkler Handabdruck.</span></p>
        <p class="lm-drift__status" aria-live="polite">Der Nebel bewegt sich gegen den Luftzug.</p>
        <button class="lm-drift__continue" id="drift-continue" type="button">Weiter</button>
    </main>
    <script src="liminal-art.js"></script>
    <script>
        LM_ART.cracks(document.querySelector('.lm-drift__cracks'), { count: 4 });
        LM_ART.mark(document.querySelector('.lm-drift__mark'));
        XIRU.ready(function () {
            document.getElementById('drift-continue').addEventListener('click', function () {
                location.href = 'abdrift2.html';
            });
        });
    </script>
</body>
</html>

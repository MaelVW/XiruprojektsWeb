<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xiru – Downloads</title>
    <link rel="stylesheet" href="Stylesheet.css">
</head>
<body>

    <nav class="menu">
        <h1>Xiru</h1>
        <a href="index.html">Start</a>
        <a href="main.html">Main</a>
        <a href="download.html">Downloads</a>
        <a href="betatesting.html">Beta Testing</a>
        <a href="ueberuns.html">Über uns</a>
    </nav>

    <main class="content">
        <h1>Downloads</h1>
        <p class="dl-intro">Hier findest du alle offiziellen Releases unserer Projekte. Klicke auf einen Download-Button um die entsprechende Version zu erhalten.</p>

        <div class="dl-grid" id="dl-grid"></div>
    </main>

    <footer>
        <p>&copy; 2026 Xiru. Kaum Rechte vorbehalten da wir broke sind ;).</p>
    </footer>

    <script>
        // ── Hier neue Einträge hinzufügen ─────────────────────────
        // datei: Name der ZIP-Datei im Ordner /downloads/
        const projekte = [
            {
                name:        'Xiru Core',
                version:     'v1.0.0',
                beschreibung: 'Die Hauptanwendung des Xiru-Projekts.',
                datei:       'xiru-core-v1.0.0.zip',
                groesse:     '—'
            },
            // Weiteres Projekt einfach hier eintragen:
            // {
            //     name:        'Projektname',
            //     version:     'v1.0.0',
            //     beschreibung: 'Kurze Beschreibung.',
            //     datei:       'dateiname.zip',
            //     groesse:     '12 MB'
            // },
        ];
        // ─────────────────────────────────────────────────────────

        const grid = document.getElementById('dl-grid');

        projekte.forEach(p => {
            grid.insertAdjacentHTML('beforeend', `
                <div class="dl-card">
                    <div class="dl-card__header">
                        <span class="dl-card__name">${p.name}</span>
                        <span class="dl-card__version">${p.version}</span>
                    </div>
                    <p class="dl-card__desc">${p.beschreibung}</p>
                    <div class="dl-card__footer">
                        <span class="dl-card__size">${p.groesse !== '—' ? '&#128190; ' + p.groesse : ''}</span>
                        <a href="downloads/${p.datei}" download class="dl-btn">&#11015; Download</a>
                    </div>
                </div>
            `);
        });
    </script>

</body>
</html>

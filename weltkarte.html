<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weltkarte · Xiruprojekts</title>
    <meta name="description" content="Sektaria – die Inseln der Nebelsee als Pixel-Seekarte: alle Inseln, Gebäude und Seewege. Reise mit deinem Mech von Insel zu Insel.">
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/welt.css">
    <script src="assets/js/site.js"></script>
    <script src="assets/js/core.js"></script>
    <script src="assets/js/mech-art.js"></script>
    <script src="assets/js/weltkarte-art.js"></script>
    <script src="assets/js/weltkarte-pixel.js"></script>
    <script src="assets/js/pixel-icons.js"></script>
    <script src="assets/js/werft.js"></script>
    <style>
        .atlas { position: relative; height: min(76vh, 860px); min-height: 420px; overflow: hidden; background: #061a2e; touch-action: none; user-select: none; cursor: grab;
            box-shadow: 0 0 0 3px #000, 0 0 0 6px #7a6230, 8px 8px 0 6px rgba(0,0,0,.45); }
        .atlas.is-dragging { cursor: grabbing; }
        .wk-isle { cursor: pointer; }
        .wk-isle:focus { outline: none; }
        .wk-isle:hover path, .wk-isle:focus-visible path { fill: rgba(253, 230, 138, .12); }
        .wk-dragon { cursor: pointer; }
        .sel-ring { fill: none; stroke: #fde68a; stroke-width: 6; stroke-dasharray: 12 12; pointer-events: none; animation: ringDash 1.2s steps(4) infinite; }
        @keyframes ringDash { to { stroke-dashoffset: -24; } }
        html.no-anim .sel-ring { animation: none; }
        .px-ui { background: #13243a; color: #e2e8f0; box-shadow: 0 0 0 3px #000, 0 0 0 5px #e8c56a, 5px 5px 0 5px rgba(0,0,0,.5); }
        .px-ui h2, .px-ui b { color: #f4e3ae; }
        .px-ui h2 { font: 800 1.15rem Consolas, "Cascadia Code", monospace; letter-spacing: .08em; text-transform: uppercase; margin: 0; }
        .atlas__ctrl { position: absolute; right: .9rem; top: .9rem; display: flex; flex-direction: column; gap: .55rem; z-index: 2; }
        .atlas__ctrl button { width: 40px; height: 40px; border: 0; background: #13243a; color: #f4e3ae; font: 800 1.2rem Consolas, monospace; cursor: pointer; box-shadow: 0 0 0 3px #000, 0 0 0 5px #e8c56a; display: grid; place-items: center; }
        .atlas__ctrl button:hover { background: #1e3654; }
        .atlas__ctrl button:active { transform: translate(1px, 1px); }
        .atlas__mech { position: absolute; left: .9rem; top: .9rem; z-index: 2; width: min(300px, calc(100% - 5rem)); padding: .65rem .8rem; font-size: .82rem; }
        .atlas__mech .row { gap: .35rem; margin-top: .45rem; }
        .chip-px { display: inline-flex; align-items: center; gap: .3rem; padding: .15rem .45rem; background: #0b1726; box-shadow: 0 0 0 2px #000; font: 700 .75rem Consolas, monospace; color: #e2e8f0; text-decoration: none; }
        a.chip-px:hover { background: #1e3654; }
        .atlas__panel { position: absolute; right: .9rem; bottom: .9rem; z-index: 2; width: min(380px, calc(100% - 1.8rem)); max-height: calc(100% - 1.8rem); overflow: auto; padding: 1rem; }
        .atlas__panel .muted { color: #94a3b8; }
        .atlas__panel a { color: #7dd3fc; }
        .px-btn { display: flex; gap: .5rem; align-items: center; justify-content: center; width: 100%; padding: .55rem .7rem; border: 0; cursor: pointer; font: 800 .85rem Consolas, monospace; letter-spacing: .05em; text-transform: uppercase;
            background: #e8c56a; color: #1a1000; box-shadow: inset -3px -3px 0 rgba(0,0,0,.35), inset 3px 3px 0 rgba(255,255,255,.35), 0 0 0 3px #000; }
        .px-btn:disabled { background: #475569; color: #cbd5e1; cursor: not-allowed; }
        .px-btn:active:not(:disabled) { transform: translate(1px, 1px); }
        .px-x { border: 0; background: #0b1726; color: #f4e3ae; width: 30px; height: 30px; font: 800 1rem Consolas, monospace; cursor: pointer; box-shadow: 0 0 0 2px #000; }
        .bldg { display: grid; gap: .45rem; margin: .8rem 0; }
        .bldg button { display: flex; gap: .65rem; align-items: center; padding: .45rem .6rem; border: 0; background: #0b1726; color: #f1f5f9; font: inherit; text-align: left; cursor: pointer; box-shadow: 0 0 0 2px #000, 0 0 0 3px #2d4a6b; }
        .bldg button:hover { background: #1e3654; box-shadow: 0 0 0 2px #000, 0 0 0 3px #e8c56a; }
        .plist { list-style: none; padding: 0; margin: .4rem 0 0; font-size: .82rem; columns: 2; column-gap: 1rem; }
        .plist li { break-inside: avoid; padding: .1rem 0; }
        .plist li.unseen { color: #64748b; }
        .dot { display: inline-block; width: 6px; height: 6px; margin-right: .35rem; background: #e8c56a; box-shadow: 0 0 0 1px #000; vertical-align: 1px; }
        .unseen .dot { background: transparent; box-shadow: inset 0 0 0 1px #64748b; }
        .tipbox { position: absolute; pointer-events: none; z-index: 3; padding: .35rem .6rem; font: 700 .8rem Consolas, monospace; transform: translate(-50%, calc(-100% - 16px)); white-space: nowrap; }
        .tipbox small { display: block; color: #94a3b8; font-weight: 400; }
        .tok { filter: drop-shadow(0 0 6px rgba(63, 243, 255, .7)); }
        @media (max-width: 720px) {
            .atlas { height: 70vh; }
            .atlas__mech { font-size: .74rem; padding: .45rem .55rem; }
            .atlas__panel { left: .7rem; right: .7rem; width: auto; max-height: 55%; }
        }
        .lists { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); }
        .lists ul { list-style: none; padding: 0; margin: .5rem 0 0; font-size: .88rem; max-height: 220px; overflow-y: auto; }
        .lists li { padding: .2rem 0; }
        .lists li.unseen { color: var(--text-faint); }
    </style>
</head>
<body>
<main class="content content--wide">
    <header class="page-head">
        <span class="eyebrow">Zentrum · Seekarte</span>
        <h1>Sektaria</h1>
        <p class="lead" id="lead">Die Inseln der Nebelsee. Zieh die Karte mit der Maus oder dem Finger, zoom mit dem Mausrad. Klick auf eine Insel, um ihre Gebäude zu sehen – und reise mit deinem Mech dorthin.</p>
    </header>

    <div class="atlas" id="atlas" role="img" aria-label="Pixel-Seekarte von Sektaria">
        <div class="atlas__mech px-ui" id="mechbox"></div>
        <div class="atlas__ctrl">
            <button type="button" id="z-in" title="Hineinzoomen" aria-label="Hineinzoomen">+</button>
            <button type="button" id="z-out" title="Herauszoomen" aria-label="Herauszoomen">−</button>
            <button type="button" id="z-fit" title="Ganze Karte" aria-label="Ganze Karte"><i data-px="st-R"></i></button>
            <button type="button" id="z-mech" title="Zu meinem Mech" aria-label="Zu meinem Mech"><i data-px="z-anker"></i></button>
        </div>
        <section class="atlas__panel px-ui" id="panel" hidden aria-live="polite"></section>
        <div class="tipbox px-ui" id="tip" hidden></div>
    </div>

    <h2 class="mt-4">Alle Orte</h2>
    <div class="lists" id="lists"></div>
</main>
<script>
XIRU.ready(function () {
    const X = XIRU, M = X.mech, W = X.werft, P = X.profile(), NS = 'http://www.w3.org/2000/svg', PX = W.px;
    const atlas = X.$('#atlas'), panel = X.$('#panel'), tip = X.$('#tip');
    const easy = X.easy(), kompass = X.hasSkill('e1'), karto = X.hasSkill('e3');
    const visitedSecret = X.pages.some(p => p.r === 'geheim' && P.visited[p.p]);
    const anim = X.setting('anim') !== false;
    let sel = null, moved = false, ctl = null, tokCv = null, tokT = null;
    W.pxify(atlas);

    /* ── Pixel-Karte einsetzen ── */
    function build() {
        if (ctl) { clearInterval(tokT); ctl.destroy(); }
        ctl = X.mapPix.mount(atlas, { discovered: id => M.discovered(id), visitedSecret, anim });
        atlas.insertBefore(ctl.cam, atlas.firstChild);
        X.$$('.wk-isle', ctl.ov).forEach(g => {
            const id = g.dataset.isle;
            g.addEventListener('click', () => { if (!moved) select(id); });
            g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); select(id); } });
            hover(g, () => tipFor(id));
        });
        X.$$('.wk-dragon', ctl.ov).forEach(d => hover(d, () => '<b>Hic sunt dracones</b><small>Hier sind Drachen.</small>'));
        X.$$('.wk-unknown', ctl.ov).forEach(u => {
            hover(u, () => '<b>Unbekanntes Land</b><small>' + X.pick(['Noch im Nebel …', 'Hier ist die Karte noch leer.', 'Unerforschtes Land.', 'Man hört leises Laufwerk-Rattern.']) + '</small>');
            if (u.dataset.u === '5') X.riss.bind(1, u, 5);
        });
        // Riss in der Karte (Weltenwanderer)
        if (X.hasSkill('e6')) {
            const g = document.createElementNS(NS, 'g'); g.setAttribute('transform', 'translate(2150 300)'); g.style.cursor = 'pointer';
            g.innerHTML = '<rect x="-30" y="-30" width="60" height="60" fill="#000" stroke="#a78bfa" stroke-width="6" stroke-dasharray="12 6"/><rect x="-14" y="-14" width="28" height="28" fill="#f472b6"/>';
            g.addEventListener('click', () => { location.href = X.url('geheim/void.html'); });
            hover(g, () => '<b>Ein Riss in der Karte</b><small>Weltenwanderer dürfen hindurch.</small>');
            ctl.layer('top').appendChild(g);
        }
        applyView(); drawOverlay();
    }
    function tipFor(id) {
        const i = M.isle(id), secret = i.secret && !visitedSecret;
        if (secret) return '<b>???</b><small>Ein Ort im Nebel</small>';
        const seen = M.discovered(id);
        return '<b>' + X.esc(i.n) + '</b><small>' + (easy ? 'Klick: Gebäude ansehen' : seen ? (M.pos() === id ? 'Dein Mech ist hier' : Math.round(M.travelSecs(id)) + ' s Reise') : 'Expedition: ' + X.esc(M.islandReqText(id))) + '</small>';
    }

    /* ── Mech-Figur (Pixel-Sprite) und Auswahl ── */
    function drawOverlay() {
        const top = ctl.layer('route'); top.innerHTML = '';
        if (sel) {
            const i = M.isle(sel), r = document.createElementNS(NS, 'rect');
            [['x', i.x - i.s * 1.3], ['y', i.y - i.s * 1.02], ['width', i.s * 2.6], ['height', i.s * 2.04]].forEach(([k, v]) => r.setAttribute(k, Math.round(v)));
            r.setAttribute('class', 'sel-ring'); top.appendChild(r);
        }
        if (tokCv) { tokCv.remove(); tokCv = null; } clearInterval(tokT);
        if (easy) return;
        const pos = M.isle(M.pos()), S = ctl.S;
        tokCv = document.createElement('canvas'); tokCv.width = 44; tokCv.height = 44;
        ctl.place(tokCv, Math.round((pos.x + pos.s * .38) / S) * S, Math.round((pos.y + pos.s * .02) / S) * S, 44 * S, 44 * S, 'tok' + (anim ? ' pm-bob' : ''));
        const paint = () => X.mapPix.mechSprite(tokCv, performance.now() / 1000);
        paint(); if (anim) tokT = setInterval(() => { if (!document.hidden) paint(); }, 220);
    }

    /* ── Mech-Status oben links ── */
    function drawMechBox() {
        const box = X.$('#mechbox');
        if (easy) { box.innerHTML = PX('z-kompass', 18) + ' <b>Entdecker-Modus</b><br><span class="small">Alle Inseln sind offen. Klick eine Insel an und betritt ihre Gebäude.</span>'; return; }
        const st = M.stats(), pos = M.isle(M.pos());
        box.innerHTML = PX('z-anker', 16) + ' Dein Mech: <b>' + X.esc(pos.n) + '</b>' + (M.ready() ? '' : ' · <span style="color:#fca5a5">nicht fahrbereit</span>') +
            '<div class="row">' + ['R', 'E', 'S', 'P', 'A'].map(k => '<span class="chip-px" title="' + W.STAT[k] + '">' + W.STAT_I[k] + ' ' + st[k] + '</span>').join('') + '</div>' +
            '<div class="row"><span class="chip-px">' + PX('schrott') + ' ' + X.fmt(M.scrap()) + '</span><span class="chip-px">' + PX('taler') + ' ' + X.fmt(M.taler()) + '</span><a class="chip-px" href="' + X.url('konto/skilltree.html') + '">' + PX('mat-zahnrad') + ' Werft</a></div>';
    }

    /* ── Insel-Panel ── */
    function select(id) {
        sel = id; drawOverlay();
        const i = M.isle(id), secret = i.secret && !visitedSecret, seen = M.discovered(id), here = !easy && M.pos() === id;
        const reg = X.region(i.r), pages = X.pages.filter(p => (i.game ? p.isle === id : p.r === i.r && !p.isle) && (!p.hidden || P.visited[p.p] || karto));
        let h = '<div class="row"><h2>' + (secret ? '???' : X.esc(i.n)) + '</h2><span class="spacer"></span><button class="px-x" type="button" data-x aria-label="Schliessen">×</button></div>';
        if (secret) {
            h += '<p class="small muted mt-1">Ruinen im Nebel. Kein Seeweg führt dorthin – man sagt, nur wer Geheimnisse sammelt, findet einen Eingang.</p>';
            panel.innerHTML = h; panel.hidden = false; wirePanel(); return;
        }
        h += '<p class="small muted mt-1">' + X.esc(i.d || (reg ? reg.desc : '')) + '</p>';
        if (!easy) {
            if (here) h += '<p class="small">' + PX('z-anker') + ' <b>Dein Mech liegt hier vor Anker.</b></p>';
            else if (!seen) h += '<p class="small">' + PX('ev-nebel') + ' <b>Noch im Nebel.</b> Erste Reise braucht: ' + X.esc(M.islandReqText(id)) + (M.canReach(id) ? ' – <span style="color:#86efac">dein Mech schafft das!</span>' : '<br><span style="color:#fca5a5">Es fehlt: ' + X.esc(M.missing(id).join(' · ')) + '</span>') + '</p>';
            else h += '<p class="small">' + PX('ev-schiff') + ' ' + Math.round(M.dist(M.pos(), id) / 10) + ' Seemeilen · ca. ' + Math.round(M.travelSecs(id)) + ' s Reise von ' + X.esc(W.isleName(M.pos())) + '</p>';
            if (!here) h += '<button class="px-btn" type="button" data-travel' + (!seen && !M.canReach(id) ? ' disabled' : '') + '>' + PX(seen ? 'ev-schiff' : 'z-kompass') + ' ' + (seen ? 'Hinreisen' : 'Expedition starten') + '</button>';
        }
        if (seen || easy) {
            h += '<div class="bldg">' + i.b.map(b => {
                const pg = X.pageFor(b[1]), lock = pg && !X.isUnlocked(pg);
                return '<button type="button" data-enter="' + X.esc(b[1]) + '">' + (X.pix.has(b[2]) ? PX(b[2], 26) : '<span style="width:26px;text-align:center">' + X.esc(b[2]) + '</span>') + '<span><b>' + X.esc(b[0]) + '</b><br><span class="small muted">' + (lock ? 'gesperrt · ' : '') + X.esc(pg ? pg.t : '') + '</span></span></button>';
            }).join('') + '</div>';
            if (!i.game && pages.length) {
                const seenN = pages.filter(p => P.visited[p.p]).length;
                h += '<p class="small mb-0"><b>Orte auf der Insel:</b> ' + seenN + '/' + pages.length + ' besucht' + (kompass ? ' · ' + (pages.length - seenN) + ' unentdeckt' : '') + '</p><ul class="plist">' +
                    pages.map(p => { const v = P.visited[p.p], hid = p.hidden && !v; return '<li class="' + (v ? '' : 'unseen') + '"><span class="dot"></span>' + (hid ? '???' : '<a href="' + X.url(p.p) + '">' + X.esc(p.t) + '</a>') + '</li>'; }).join('') + '</ul>';
            }
        }
        panel.innerHTML = h; panel.hidden = false; wirePanel();
    }
    function wirePanel() {
        const close = panel.querySelector('[data-x]'); if (close) close.addEventListener('click', () => { panel.hidden = true; sel = null; drawOverlay(); });
        const tr = panel.querySelector('[data-travel]'); if (tr) tr.addEventListener('click', () => go(sel, null));
        X.$$('[data-enter]', panel).forEach(b => b.addEventListener('click', () => {
            const page = b.dataset.enter, i = M.isle(sel);
            if (easy || !i.game || M.pos() === sel) { location.href = X.url(page); return; }   // Spiel-Inseln brauchen den Mech vor Ort
            go(sel, page);
        }));
    }
    function go(id, page) { W.travel(id, { page }).then(r => { if (r && r.arrived) { build(); drawMechBox(); select(id); renderLists(); } }); }

    /* ── Tooltip ── */
    function hover(el, html) {
        const show = e => { if (moved) return; const r = atlas.getBoundingClientRect(); tip.innerHTML = html(); tip.hidden = false; tip.style.left = (e.clientX - r.left) + 'px'; tip.style.top = (e.clientY - r.top) + 'px'; };
        el.addEventListener('pointerenter', show); el.addEventListener('pointermove', show); el.addEventListener('pointerleave', () => { tip.hidden = true; });
    }

    /* ── Ziehen & Zoomen ── */
    const VW = 2400, VH = 1600;
    let vb = { x: 0, y: 0, w: VW };
    const aspect = () => atlas.clientWidth / Math.max(1, atlas.clientHeight);
    function applyView() {
        vb.w = X.clamp(vb.w, 300, VW * 1.1); const h = vb.w / aspect();
        vb.x = X.clamp(vb.x, -vb.w * .2, VW - vb.w * .8); vb.y = X.clamp(vb.y, -h * .2, VH - h * .8);
        ctl.setView(vb.x, vb.y, vb.w, h, 'contain');
    }
    function fit() { const a = aspect(); vb.w = a > VW / VH ? VH * a : VW; vb.x = (VW - vb.w) / 2; vb.y = (VH - vb.w / a) / 2; applyView(); }
    function centerOn(x, y, w) { vb.w = w || vb.w; vb.x = x - vb.w / 2; vb.y = y - vb.w / aspect() / 2; applyView(); }
    function zoom(f, cx, cy) {
        const r = atlas.getBoundingClientRect(), px = cx == null ? .5 : (cx - r.left) / r.width, py = cy == null ? .5 : (cy - r.top) / r.height;
        const h = vb.w / aspect(), mx = vb.x + vb.w * px, my = vb.y + h * py;
        vb.w *= f; vb.x = mx - vb.w * px; vb.y = my - (vb.w / aspect()) * py; applyView();
    }
    const ptrs = new Map(); let start = null, pinch = null;
    atlas.addEventListener('pointerdown', e => {
        if (e.target.closest('.atlas__ctrl, .atlas__panel, .atlas__mech')) return;
        ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY }); moved = false;
        if (ptrs.size === 1) start = { x: e.clientX, y: e.clientY, vx: vb.x, vy: vb.y };
        if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), w: vb.w }; }
    });
    atlas.addEventListener('pointermove', e => {
        if (!ptrs.has(e.pointerId)) return;
        ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
        if (ptrs.size === 2 && pinch) { const [a, b] = [...ptrs.values()], d = Math.hypot(a.x - b.x, a.y - b.y); zoom(pinch.w * pinch.d / Math.max(20, d) / vb.w, (a.x + b.x) / 2, (a.y + b.y) / 2); moved = true; return; }
        if (!start) return;
        const dx = e.clientX - start.x, dy = e.clientY - start.y;
        if (!moved && Math.hypot(dx, dy) < 6) return;
        if (!moved) { moved = true; tip.hidden = true; atlas.classList.add('is-dragging'); try { atlas.setPointerCapture(e.pointerId); } catch (err) { } }
        const s = atlas.clientWidth / vb.w; vb.x = start.vx - dx / s; vb.y = start.vy - dy / s; applyView();
    });
    const end = e => { ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch = null; if (!ptrs.size) { start = null; atlas.classList.remove('is-dragging'); setTimeout(() => { moved = false; }, 0); } };
    atlas.addEventListener('pointerup', end); atlas.addEventListener('pointercancel', end);
    atlas.addEventListener('wheel', e => { e.preventDefault(); zoom(e.deltaY > 0 ? 1.15 : 1 / 1.15, e.clientX, e.clientY); }, { passive: false });
    X.$('#z-in').addEventListener('click', () => zoom(1 / 1.3));
    X.$('#z-out').addEventListener('click', () => zoom(1.3));
    X.$('#z-fit').addEventListener('click', fit);
    X.$('#z-mech').addEventListener('click', () => { const i = M.isle(easy ? 'zentrum' : M.pos()); centerOn(i.x, i.y, 900); });
    addEventListener('resize', () => applyView());

    /* ── Listenansicht (auch für Screenreader und kleine Bildschirme) ── */
    function renderLists() {
        X.$('#lists').innerHTML = X.regions.map(reg => {
            const pages = X.pages.filter(p => p.r === reg.id && (!p.hidden || P.visited[p.p] || karto));
            if (!pages.length) return '';
            return '<section class="card" style="border-top:3px solid ' + reg.color + '"><h3 class="mb-0">' + X.esc(reg.name) + '</h3><ul>' +
                pages.map(p => {
                    const seen = P.visited[p.p], hid = p.hidden && !seen;
                    return '<li class="' + (seen ? '' : 'unseen') + '">' + (seen ? '● ' : '○ ') + (hid ? '??? <span class="small">– ' + X.esc(p.d) + '</span>' : '<a href="' + X.url(p.p) + '">' + (X.isUnlocked(p) ? '' : (M.discovered(p.isle || p.r) ? '(gesperrt) ' : '(im Nebel) ')) + X.esc(p.t) + '</a>') + '</li>';
                }).join('') + '</ul></section>';
        }).join('');
    }

    if (easy) X.$('#lead').textContent = 'Die Inseln der Nebelsee. Zieh die Karte mit der Maus oder dem Finger, zoom mit dem Mausrad. Im Entdecker-Modus ist jede Insel offen – klick eine an und betritt ihre Gebäude.';
    build(); drawMechBox(); renderLists(); fit();
    if (!easy && innerWidth < 900) { const i = M.isle(M.pos()); centerOn(i.x, i.y, 1100); }
    const want = location.hash.slice(1); if (want && M.isle(want)) { const i = M.isle(want); centerOn(i.x, i.y, 1000); select(want); }
    X.on('mech', drawMechBox);
});
</script>
</body>
</html>

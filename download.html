<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xiruprojekts – Downloads</title>
    <link rel="stylesheet" href="Stylesheet.css">
</head>
<body>

    <nav class="menu">
        <h1>Xiruprojekts</h1>
        <a href="index.html">Start</a>
        <a href="download.html">Downloads</a>
        <a href="betatesting.html">Beta Testing</a>
        <a href="ueberuns.html">Über uns</a>
    </nav>

    <main class="content">
        <h1>Downloads</h1>
        <p class="dl-intro">Hier findest du alle offiziellen Releases unserer Projekte. Klicke auf einen Download-Button um die entsprechende Version zu erhalten.</p>

        <div class="dl-grid" id="dl-grid"></div>
    </main>

    <footer>
        <p>&copy; 2026 Xiruprojekts. Kaum Rechte vorbehalten da wir broke sind ;). &nbsp;|&nbsp; <a href="nutzerbedingungen.html">Nutzungsbedingungen</a></p>
    </footer>

    <script>
        // ── Hier neue Einträge hinzufügen ─────────────────────────
        // datei: Name der ZIP-Datei im Ordner /downloads/
        const projekte = [
            {
                name:         'Xiru Core',
                version:      'v1.0.0',
                beschreibung: 'Die Hauptanwendung des Xiru-Projekts.',
                datei:        'xiru-core-v1.0.0.zip',
                groesse:      '—',
                preis:        0.00   // 0.00 = Kostenlos
            },
            {
                name:         'Xiru Pro Tools',
                version:      'v1.2.0',
                beschreibung: 'Erweitertes Toolset mit exklusiven Features für professionelle Nutzer.',
                datei:        'xiru-pro-tools-v1.2.0.zip',
                groesse:      '18 MB',
                preis:        9.90   // in CHF
            },
            // Weiteres Projekt einfach hier eintragen:
            // {
            //     name:         'Projektname',
            //     version:      'v1.0.0',
            //     beschreibung: 'Kurze Beschreibung.',
            //     datei:        'dateiname.zip',
            //     groesse:      '12 MB',
            //     preis:        4.90   // in CHF
            // },
        ];
        // ─────────────────────────────────────────────────────────

        const grid = document.getElementById('dl-grid');

        projekte.forEach(p => {
            const kostenlos = p.preis === 0;
            const preisLabel = kostenlos
                ? '<span class="dl-card__preis dl-card__preis--free">Kostenlos</span>'
                : `<span class="dl-card__preis">CHF ${p.preis.toFixed(2)}</span>`;

            const actionBtn = kostenlos
                ? `<a href="downloads/${p.datei}" download class="dl-btn">Download</a>`
                : `<a href="Checkout.html?name=${encodeURIComponent(p.name)}&version=${encodeURIComponent(p.version)}&preis=${p.preis}&datei=${encodeURIComponent(p.datei)}" class="dl-btn dl-btn--pay">$ Kaufen</a>`;

            grid.insertAdjacentHTML('beforeend', `
                <div class="dl-card">
                    <div class="dl-card__header">
                        <span class="dl-card__name">${p.name}</span>
                        <span class="dl-card__version">${p.version}</span>
                    </div>
                    <p class="dl-card__desc">${p.beschreibung}</p>
                    <div class="dl-card__footer">
                        <div class="dl-card__meta">
                            ${preisLabel}
                            ${p.groesse !== '—' ? `<span class="dl-card__size">${p.groesse}</span>` : ''}
                        </div>
                        ${actionBtn}
                    </div>
                </div>
            `);
        });
    </script>

</body>
</html>
